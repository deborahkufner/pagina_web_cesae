<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h2 class="titulo-checkout text-center mb-4">Finalizar Encomenda</h2>

    <form>

        <!-- Nome completo -->
        <div class="mb-3">
            <label for="nome" class="form-label required">Nome completo</label>
            <input type="text" class="form-control" id="nome" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label required">E-mail</label>
            <input type="email" class="form-control" id="email" required>
        </div>
            
        <!-- Telemóvel -->
        <div class="mb-3">
            <label for="nome" class="form-label required">Telemóvel</label>
            <input type="text" class="form-control" id="nome" required>
        </div>

        <!-- Morada -->
        <div class="mb-3">
            <label for="morada" class="form-label required">Endereço de entrega</label>
            <textarea class="form-control" id="morada" rows="3" maxlength="150" required></textarea>
            <div class="form-text">Máximo 150 caracteres</div>
        </div>

        <!-- NIF (opcional) -->
        <div class="mb-3">
            <label for="nif" class="form-label">NIF (opcional)</label>
            <input type="text" class="form-control" id="nif" maxlength="9">
        </div>

        <!-- Dados do cartão -->
        <div class="mb-3">
            <label class="form-label required">Dados do cartão</label>

            <input type="text" class="form-control mb-2" placeholder="Número do cartão" required>

            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" placeholder="MM/AA" required>
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="CVV" required>
                </div>
            </div>
        </div>
        <p class="form-text text-muted mt-2" style="font-size: 0.85rem;">
    * itens obrigatórios </p>

        <!-- Botão -->
        <button type="submit" class="btn btn-dark w-100 mt-3">
            Finalizar compra
        </button>

    </form>
</div>
